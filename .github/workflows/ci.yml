# The merge gates (ADR-007, ADR-064). Every gate must pass before a PR merges.
# A gate split into parallel jobs reports under its own check name through a
# final job that fails when any of its parts failed or was cancelled, so the
# ruleset's required names stay the same.
name: CI

on:
  pull_request:
    # labeled lets a maintainer's full-ci label start an outside pull
    # request's full suite (ADR-064). Any other label runs the whole workflow
    # again, as a push would: a run that skipped its jobs would publish
    # skipped checks over the ones it replaced and hide a failure.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # Once a day every job runs on main and saves its cache, the only caches a
  # pull request can restore; a push to main skips the heavy jobs (ADR-055)
  # and saves none (ADR-064).
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run. The
# event name keeps the daily run on main apart from pushes to main.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # On a push to main, decides whether the heavy jobs may skip: they do only
  # when the pushed commit is a pull request's squash merge with the tree that
  # pull request's CI passed on (ADR-055). Any doubt runs everything, and a
  # pull request skips this job and runs everything. `policy` runs on main
  # either way, since new RustSec advisories can fail it on an unchanged tree.
  main-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-main-gate.py
          sparse-checkout-cone-mode: false
      - id: decide
        name: Skip the heavy jobs only on a tree a pull request's CI passed on
        # Neither a crash nor a hung API call fails the job; either leaves no
        # output, and the jobs below run.
        continue-on-error: true
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: python3 scripts/ci-main-gate.py

  # Decides which jobs this run may skip (ADR-064): a change to docs text
  # alone skips the build, fuzz and formal jobs, a change to docs text and
  # add-ons alone skips fuzz and formal, and an outside pull request without
  # the full-ci label runs only policy and secrets. Only an output of `true`
  # skips a job, so a crash, which leaves no output, runs everything.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      outside: ${{ steps.decide.outputs.outside }}
      skip-build: ${{ steps.decide.outputs.skip-build }}
      skip-deep: ${{ steps.decide.outputs.skip-deep }}
    steps:
      # Two commits: a pull request's merge commit and main, its first parent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: decide
        name: Skip only what the changed files cannot reach
        continue-on-error: true
        timeout-minutes: 3
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BEFORE: ${{ github.event.before }}
        run: python3 scripts/ci-plan.py

  # The rust gate runs as two jobs on each system, at once: rustfmt and
  # clippy, and the tests. macOS runs only these, as before; its rustfmt and
  # installer steps are the ones it ran before the split (ADR-064).
  rust-lint:
    name: rust lint (${{ matrix.os }})
    needs: [main-gate, plan]
    if: ${{ !cancelled() && needs.main-gate.outputs.skip != 'true' && needs.plan.outputs.skip-build != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install Skia's system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype-dev
      # Caches the registry, build output and the downloaded Skia archive.
      # Only main saves, so pull requests restore the daily run's cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy, warnings as errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-test:
    name: rust test (${{ matrix.os }})
    needs: [main-gate, plan]
    if: ${{ !cancelled() && needs.main-gate.outputs.skip != 'true' && needs.plan.outputs.skip-build != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install Skia's system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: tests
        run: cargo test --workspace --locked
      - name: installer (macOS only; skips on Linux)
        run: sh scripts/test_install.sh
      - name: installer package (macOS only; skips on Linux)
        run: sh scripts/test_package.sh

  # The rust gate's check on each system, the name the ruleset requires. It
  # runs even when its jobs skip, since a skipped matrix job publishes no
  # check under its system's name, and fails when either job failed or was
  # cancelled on either system.
  rust:
    name: rust (${{ matrix.os }})
    needs: [rust-lint, rust-test]
    if: ${{ always() }}
    strategy:
      # Each system's check reports its own verdict; without this a failing
      # leg cancels the other and leaves its required check cancelled.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: rust lint and rust test passed or skipped
        env:
          LINT: ${{ needs.rust-lint.result }}
          TEST: ${{ needs.rust-test.result }}
        run: |
          echo "rust lint: $LINT; rust test: $TEST (on both systems; their own checks name the system)."
          for result in "$LINT" "$TEST"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A rust lint or rust test job did not pass."; exit 1 ;;
            esac
          done

  # The release job's build and binary check (ADR-022), on Linux so every PR
  # proves the forms and tokens stay sealed and no source path leaks.
  release-binary:
    needs: [main-gate, plan]
    if: ${{ !cancelled() && needs.main-gate.outputs.skip != 'true' && needs.plan.outputs.skip-build != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install Skia's system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-binary
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # A release stamps its tag's version; any version but 0.0.0 turns on
      # the daily update check (ADR-032), which the no-network job needs live.
      - name: Build as the release job does
        run: TILES_VERSION=0.0.1 RUSTFLAGS="$(sh scripts/release-rustflags.sh)" cargo build --release --locked -p tiles-cli
      - name: The binary carries no source path and no readable form, token or colour
        run: python3 scripts/check-release-binary.py target/release/tiles --forbid "$GITHUB_WORKSPACE" --forbid "$HOME" ${TILES_DESIGN_PACK:+--pack "$TILES_DESIGN_PACK"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tiles-linux
          path: target/release/tiles
          retention-days: 1
          if-no-files-found: error

  adapters:
    needs: [main-gate, plan]
    if: ${{ !cancelled() && needs.main-gate.outputs.skip != 'true' && needs.plan.outputs.outside != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 22.18 runs TypeScript test files directly (type stripping), so
      # the add-ons need no npm install and no lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - name: Harness add-on tests
        run: node --test adapters/pi/index.test.ts adapters/claude/card.spec.ts
      # The mod's hooks need Claude Code's own test kit, which ships in its
      # binary. Pinned to the newest version in crates/tiles-cli/src/proved.rs.
      - name: Claude Code mod tests
        run: |
          npm install --prefix "$RUNNER_TEMP/claude" --no-audit --no-fund @anthropic-ai/claude-code@2.1.316
          "$RUNNER_TEMP/claude/node_modules/.bin/claude" plugin test adapters/claude

  # The add-ons' tests and the release-binary job's tiles drawing the repo's
  # own intents, with no network: a network namespace that drops every
  # packet, and strace failing the job on any connect, addressed send or DNS
  # lookup, failed ones included (ADR-058).
  no-network:
    needs: [main-gate, release-binary]
    if: ${{ !cancelled() && needs.main-gate.outputs.skip != 'true' && needs.release-binary.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tiles-linux
          path: ${{ runner.temp }}/bin
      - name: Install strace and let the runner user make a network namespace
        # Ubuntu 24.04's AppArmor refuses unprivileged user namespaces by
        # default; unshare needs one to make the network namespace unprivileged.
        run: |
          chmod +x "$RUNNER_TEMP/bin/tiles"
          echo "TILES_BIN=$RUNNER_TEMP/bin/tiles" >> "$GITHUB_ENV"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends strace
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: The sandbox fails a probe that connects out, a name lookup and the daily update check
        run: TILES_NO_NETWORK_REQUIRED=1 python3 -m unittest scripts/test_policy_scripts.py -k NoNetwork -v
      - name: Harness add-on tests, with no network
        run: python3 scripts/no-network.py "$RUNNER_TEMP/trace-addons" node --test adapters/pi/index.test.ts adapters/claude/card.spec.ts
      - name: tiles card, tiles theme and tiles mcp on the repo's intents, with no network
        run: python3 scripts/no-network.py "$RUNNER_TEMP/trace-cards" python3 scripts/drive-addon-paths.py "$TILES_BIN"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: no-network-traces
          path: ${{ runner.temp }}/trace-*
          if-no-files-found: ignore

  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: Licences, advisories, bans and sources
        run: cargo deny check
      # A second reader of the RustSec database, over every package in
      # Cargo.lock whatever its target (ADR-024).
      - name: Known vulnerabilities (cargo-audit)
        run: cargo audit
      - name: Every definition-of-done point and playbook rule names a real check
        run: python3 scripts/check-docs.py
      - name: Only the data source crates reach the network, and nothing sends telemetry
        run: python3 scripts/check-network-owners.py
      - name: The policy scripts catch what they exist to catch
        run: python3 -m unittest scripts/test_policy_scripts.py

  # Every parser of untrusted input under libFuzzer and AddressSanitizer for
  # 60 s, from the committed seed corpus (ADR-009, ADR-024), one job per
  # target at once (ADR-064). The list is every file in fuzz/fuzz_targets/,
  # which scripts/test_policy_scripts.py checks. A crash fails the job and its
  # input is kept as an artifact.
  fuzz-target:
    name: fuzz (${{ matrix.target }})
    needs: [main-gate, plan]
    if: ${{ !cancelled() && needs.main-gate.outputs.skip != 'true' && needs.plan.outputs.skip-deep != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        target: [block, intent, pane_input, terminal_replies, terminal_stream, warehouse_source]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NIGHTLY: nightly-2026-10-01
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain and a dated nightly for the sanitizer
        run: rustup toolchain install && rustup toolchain install "$NIGHTLY" --profile minimal
      # One cache for every target: the sanitized dependencies and cargo-fuzz
      # itself, in ~/.cargo/bin.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fuzz
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz the parser for 60 seconds
        run: cargo "+$NIGHTLY" fuzz run "$TARGET" "fuzz/corpus/$TARGET" -- -max_total_time=60
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  # The fuzz gate's check, the name the ruleset requires: fails when any
  # target's job failed or was cancelled.
  fuzz:
    needs: fuzz-target
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every fuzz target passed or skipped
        env:
          RESULT: ${{ needs.fuzz-target.result }}
        run: |
          echo "fuzz targets: $RESULT"
          case "$RESULT" in
            success|skipped) ;;
            *) echo "::error::A fuzz target's job did not pass; its own check names the target."; exit 1 ;;
          esac

  # The formal proofs (ADR-026): the painter's TLA+ model under TLC, which
  # fails the job on a counterexample, and the Kani proofs of the kitty
  # payload encoder, whose install and run may fail without blocking a PR
  # until two green runs show their runtime.
  formal:
    needs: [main-gate, plan]
    if: ${{ !cancelled() && needs.main-gate.outputs.skip != 'true' && needs.plan.outputs.skip-deep != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      KANI_VERSION: 0.68.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # ~/.kani holds the Kani bundle (its binaries and CBMC) and a link to
      # the bundle's nightly, which `cargo kani setup` installs into ~/.rustup
      # and rustup fetches again on a run that restores only ~/.kani. The
      # cache is saved only after a finished install, so a failed fetch never
      # stores a half-done one under the key.
      - id: kani-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/kani
            ~/.cargo/bin/cargo-kani
          key: kani-${{ env.KANI_VERSION }}-${{ runner.os }}
      - id: install-kani
        name: Install Kani
        continue-on-error: true
        run: |
          if [ ! -x "$HOME/.kani/kani-$KANI_VERSION/bin/kani-driver" ]; then
            cargo install --locked --force kani-verifier --version "$KANI_VERSION"
            bundle="$(sh scripts/fetch-kani-bundle.sh "$RUNNER_TEMP/kani")"
            cargo kani setup --use-local-bundle "$bundle"
          fi
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.install-kani.outcome == 'success' && steps.kani-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/kani
            ~/.cargo/bin/cargo-kani
          key: kani-${{ env.KANI_VERSION }}-${{ runner.os }}
      - name: Model-check the painter (TLC)
        run: sh verify/formal/painter/check.sh
      - name: Prove the kitty payload encoder (Kani)
        continue-on-error: true
        run: sh verify/formal/kitty/check.sh

  # No secret in the tree or in any commit, by gitleaks' default rules and
  # the allowances in .gitleaks.toml (ADR-024).
  secrets:
    needs: main-gate
    if: ${{ !cancelled() && needs.main-gate.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks, checked against its pinned hash
        run: |
          gitleaks="$(sh scripts/fetch-gitleaks.sh "$RUNNER_TEMP/gitleaks")"
          echo "GITLEAKS=$gitleaks" >> "$GITHUB_ENV"
      - name: Every commit
        run: '"$GITLEAKS" git --no-banner --redact --exit-code 1 .'
      - name: The tree
        run: '"$GITLEAKS" dir --no-banner --redact --exit-code 1 .'

  # The outside pull request gate (ADR-064): one check that fails until an
  # outside pull request has the full-ci label, and fails whenever a job
  # failed or was cancelled. Every other job skips on an outside pull request
  # but policy and secrets, and a skipped job satisfies a required check, so
  # the ruleset requires this one too. It reads the pull request itself
  # rather than the plan job's output, so a plan that fails cannot open it.
  full-suite:
    name: full suite
    needs: [plan, rust-lint, rust-test, rust, release-binary, adapters, no-network, policy, fuzz-target, fuzz, formal, secrets]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the full-ci label on an outside pull request, and passing jobs
        env:
          FULL: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || github.event.pull_request.author_association == 'OWNER' || github.event.pull_request.author_association == 'MEMBER' || github.event.pull_request.author_association == 'COLLABORATOR' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FULL" != true ]; then
            echo "::error::An outside pull request runs the full suite only after a maintainer adds the full-ci label (CONTRIBUTING.md)."
            exit 1
          fi
          if [ "$FAILED" = true ]; then
            echo "::error::A job failed or was cancelled; see the failed jobs in this run."
            exit 1
          fi
          echo "Every job passed or skipped by plan."

  # Warns, never fails, when a job ran longer than the budget (ADR-064): three
  # minutes, above the slowest job measured before the split but fuzz, so a
  # warning marks a job that has grown and should be split or sped up.
  budget:
    name: time budget
    needs: [plan, rust-lint, rust-test, release-binary, adapters, no-network, policy, fuzz-target, formal, secrets]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci-budget.py
          sparse-checkout-cone-mode: false
      - name: Warn about any job over three minutes
        continue-on-error: true
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUDGET_SECONDS: "180"
        run: python3 scripts/ci-budget.py
