# Light checks on every push to a branch other than main (ADR-063): rustfmt,
# clippy and the add-ons' node tests, on Linux, so a branch learns about a
# lint failure before its pull request runs the merge gates in ci.yml. None
# of these checks is required; ci.yml's are.
name: Branch

on:
  push:
    branches-ignore: [main]
    # Text no lint reads.
    paths-ignore:
      - "docs/**"
      - README.md
      - AGENTS.md
      - CLAUDE.md
      - CONTRIBUTING.md
      - SECURITY.md
      - TRADEMARKS.md

permissions:
  contents: read

concurrency:
  group: branch-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: branch lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install Skia's system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype-dev
      # Restores the cache ci.yml's rust lint job saves on main; saves none.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy
          save-if: false
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy, warnings as errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The node tests only: ci.yml's adapters job also runs `claude plugin test`,
  # which installs Claude Code from npm.
  adapters:
    name: branch adapters
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - name: Harness add-on tests
        run: node --test adapters/pi/index.test.ts adapters/claude/card.spec.ts
