[package]
name = "tiles-cli"
description = "The `tiles` command line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tiles"
path = "src/main.rs"

[dependencies]
pty-process = "0.5.3"
ring = { version = "0.17.14", default-features = false }
rustix = { version = "1.1.5", features = ["event", "fs", "process", "termios", "stdio"] }
serde_json.workspace = true
skia-safe.workspace = true
tiles-engine.workspace = true
tiles-intent.workspace = true
tiles-mcp.workspace = true
tiles-net.workspace = true
tiles-omni.workspace = true
tiles-term.workspace = true
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
vt100 = "0.16.2"


[dev-dependencies]
tiles-omni = { workspace = true, features = ["replay"] }

[lints]
workspace = true
