[package]
name = "tiles-net"
description = "The one HTTP client Tiles' data sources share: HTTPS with the system trust store, no redirects, a deadline per call, retries and a size cap."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }

[lints]
workspace = true
